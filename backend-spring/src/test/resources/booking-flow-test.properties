# Isolated from local developer datasource settings. No persistent data is used.
spring.datasource.url=jdbc:h2:mem:booking-flow-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=${test.database.driver:org.h2.Driver}
spring.datasource.username=${test.database.user:sa}
spring.datasource.password=${test.database.password:}
spring.datasource.hikari.connection-init-sql=CREATE SCHEMA IF NOT EXISTS "ynu-shooting"; SET SCHEMA 'ynu-shooting'
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.default_schema="ynu-shooting"
jwt.secret=booking-flow-test-only-signing-key-not-for-production-2026
jwt.expiration-ms=3600000

spring.profiles.active=integration
booking.sweeper-enabled=false
spring.jpa.open-in-view=false
auth.mode=mock
